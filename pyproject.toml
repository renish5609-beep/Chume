[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chume"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "scikit-learn>=1.4", "scipy>=1.11",
  "lightgbm>=4.3", "catboost>=1.2", "pyyaml>=6", "joblib>=1.3", "matplotlib>=3.8",
  "tifffile>=2024.1", "pillow>=10", "tabulate>=0.9", "optuna>=3.5",
]

[project.optional-dependencies]
geo = ["rasterio>=1.3"]
emb = ["torch>=2.2", "torchvision>=0.17", "torchgeo>=0.6", "timm>=0.9"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
